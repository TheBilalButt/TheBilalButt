<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 220" width="100%" height="220">
  <defs>
    <linearGradient id="bs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14"/>
      <stop offset="50%" stop-color="#08090d"/>
      <stop offset="100%" stop-color="#140407"/>
    </linearGradient>
    <filter id="bs-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .stat-val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 16px; fill: #ffffff; }
    .stat-lbl { font-family: "Courier New", Courier, monospace; font-weight: 700; font-size: 11.5px; fill: #8b949e; letter-spacing: 1px; }
    .header-t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 900; font-size: 15px; fill: #ffffff; letter-spacing: 2px; }
  </style>

  <!-- Border & Background -->
  <rect x="2" y="2" width="446" height="216" rx="10" fill="url(#bs-bg)" stroke="#2e1017" stroke-width="1.5"/>

  <!-- Top Accent Slash -->
  <path d="M 2 12 L 14 2 L 120 2 L 108 12 Z" fill="#e50914" opacity="0.8"/>
  <circle cx="8" cy="8" r="2" fill="#ffffff"/>

  <!-- Card Title -->
  <g transform="translate(25, 34)">
    <text x="0" y="0" class="header-t">⚔️ REAPER BATTLE STATS</text>
    <line x1="0" y1="8" x2="395" y2="8" stroke="#ff1a40" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="395" cy="8" r="2" fill="#ff1a40"/>
  </g>

  <!-- Stat Items -->
  <g transform="translate(25, 75)">
    <!-- Repos / Expeditions -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="-4" r="3.5" fill="#e50914"/>
      <text x="20" y="0" class="stat-lbl">PUBLIC EXPEDITIONS (REPOS):</text>
      <text x="395" y="0" text-anchor="end" class="stat-val">24</text>
    </g>

    <!-- Spiritual Class -->
    <g transform="translate(0, 32)">
      <circle cx="6" cy="-4" r="3.5" fill="#ff2244"/>
      <text x="20" y="0" class="stat-lbl">REIATSU DOMAIN:</text>
      <text x="395" y="0" text-anchor="end" class="stat-val" fill="#ff4d66">AI / ML ENGINEER</text>
    </g>

    <!-- Allies / Followers -->
    <g transform="translate(0, 64)">
      <circle cx="6" cy="-4" r="3.5" fill="#ff4466"/>
      <text x="20" y="0" class="stat-lbl">CREW ALLIES (FOLLOWERS):</text>
      <text x="395" y="0" text-anchor="end" class="stat-val">5</text>
    </g>

    <!-- Bounty / Status -->
    <g transform="translate(0, 96)">
      <circle cx="6" cy="-4" r="3.5" fill="#d4af37"/>
      <text x="20" y="0" class="stat-lbl">BOUNTY STATUS:</text>
      <text x="395" y="0" text-anchor="end" class="stat-val" fill="#ffd700">★ GRAND LINE CAPTAIN ★</text>
    </g>
  </g>

  <!-- Corner Brackets -->
  <path d="M 430 200 L 442 200 L 442 188" fill="none" stroke="#e50914" stroke-width="2"/>
</svg>