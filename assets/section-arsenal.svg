<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 72" width="100%" height="72">
  <defs>
    <linearGradient id="sec-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#140407"/>
      <stop offset="35%" stop-color="#0c0e14"/>
      <stop offset="70%" stop-color="#0c0e14"/>
      <stop offset="100%" stop-color="#140407"/>
    </linearGradient>

    <linearGradient id="text-glow-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f2d6dc"/>
      <stop offset="100%" stop-color="#ff2a4b"/>
    </linearGradient>

    <filter id="crimson-filter-1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes glow-pulse-1 {
      0%, 100% { filter: drop-shadow(0 0 3px rgba(229, 9, 20, 0.4)); }
      50% { filter: drop-shadow(0 0 10px rgba(255, 30, 60, 0.8)); }
    }
    .sec-box-1 {
      animation: glow-pulse-1 3.5s ease-in-out infinite;
    }
    .title-txt-1 {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 900;
      letter-spacing: 4px;
    }
    .sub-txt-1 {
      font-family: "Courier New", Courier, monospace;
      font-weight: 700;
      letter-spacing: 2px;
    }
  </style>

  <!-- Plate Container -->
  <rect x="2" y="6" width="846" height="60" rx="10" fill="url(#sec-grad-1)" stroke="#30363d" stroke-width="1" class="sec-box-1"/>

  <!-- Left Accent Blade Cut -->
  <path d="M 2 16 L 2 56 L 16 56 L 26 16 Z" fill="#b3001b"/>
  <line x1="26" y1="16" x2="16" y2="56" stroke="#ff3355" stroke-width="1.5"/>

  <!-- Japanese Kanji Watermark -->
  <text x="825" y="47" font-family="'Yu Gothic', 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="34" font-weight="900" fill="#e50914" opacity="0.18" text-anchor="end">兵装</text>

  <!-- Right Accent Frame -->
  <path d="M 830 6 L 848 6 L 848 24" fill="none" stroke="#e50914" stroke-width="2"/>
  <path d="M 830 66 L 848 66 L 848 48" fill="none" stroke="#e50914" stroke-width="2"/>

  <!-- Title & Subtitle Group -->
  <g transform="translate(45, 0)">
    <text x="0" y="36" font-size="21" fill="url(#text-glow-1)" class="title-txt-1" filter="url(#crimson-filter-1)">MY ARSENAL</text>
    <text x="2" y="53" font-size="10.5" fill="#8b949e" class="sub-txt-1">// WEAPONS, FRAMEWORKS & RUNTIMES</text>
  </g>

  <!-- Bottom Glowing Edge -->
  <line x1="45" y1="65" x2="350" y2="65" stroke="#e50914" stroke-width="1.5" stroke-opacity="0.8"/>
  <circle cx="350" cy="65" r="2" fill="#ffffff"/>
</svg>