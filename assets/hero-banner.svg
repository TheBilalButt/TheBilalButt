<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040507"/>
      <stop offset="35%" stop-color="#090b10"/>
      <stop offset="70%" stop-color="#0d080c"/>
      <stop offset="100%" stop-color="#050306"/>
    </linearGradient>

    <radialGradient id="reiatsu-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0033" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#990018" stop-opacity="0.18"/>
      <stop offset="75%" stop-color="#4a000c" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="eye-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ff1a40"/>
      <stop offset="70%" stop-color="#b3001e"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="slash-grad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff1e38" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ff1e38" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#ff1e38" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff1e38" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8e8ea"/>
      <stop offset="90%" stop-color="#ff99a8"/>
      <stop offset="100%" stop-color="#ff2244"/>
    </linearGradient>

    <!-- Filters for Reiatsu Glow -->
    <filter id="crimson-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="blade-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#221118" stroke-width="0.7" stroke-opacity="0.35"/>
      <circle cx="0" cy="0" r="1" fill="#e50914" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulse-reiatsu {
      0%, 100% { opacity: 0.45; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.06); }
    }
    @keyframes slash-sweep {
      0% { transform: translateX(-950px) skewX(-25deg); opacity: 0; }
      15% { opacity: 0.95; }
      40% { transform: translateX(950px) skewX(-25deg); opacity: 0; }
      100% { transform: translateX(950px) skewX(-25deg); opacity: 0; }
    }
    @keyframes text-shimmer {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(229, 9, 20, 0.5)); }
      50% { filter: drop-shadow(0 0 25px rgba(255, 30, 60, 0.9)) drop-shadow(0 0 40px rgba(180, 0, 25, 0.4)); }
    }
    @keyframes flag-drift {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(1.2deg) translateY(-2px); }
    }

    .reiatsu-pulse {
      transform-origin: 475px 170px;
      animation: pulse-reiatsu 4s ease-in-out infinite;
    }
    .slash-effect {
      animation: slash-sweep 4.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }
    .text-title {
      font-family: 'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      letter-spacing: 5px;
      animation: text-shimmer 3s ease-in-out infinite;
    }
    .text-tagline {
      font-family: 'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      letter-spacing: 4px;
    }
    .text-sub {
      font-family: 'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 400;
      letter-spacing: 1.5px;
    }
    .text-badge {
      font-family: 'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .pirate-glow { animation: flag-drift 5s ease-in-out infinite; transform-origin: 110px 170px; }
  </style>

  <!-- Card Background -->
  <rect width="950" height="340" rx="16" fill="url(#bg-grad)"/>

  <!-- Tech Grid Underlay -->
  <rect width="950" height="340" rx="16" fill="url(#grid)"/>

  <!-- Bankai Spiritual Pressure / Reiatsu Cloud -->
  <ellipse cx="475" cy="170" rx="420" ry="160" fill="url(#reiatsu-core)" class="reiatsu-pulse"/>
  <ellipse cx="200" cy="170" rx="260" ry="130" fill="url(#reiatsu-core)" class="reiatsu-pulse" style="animation-delay: -1.8s;"/>
  <ellipse cx="780" cy="170" rx="240" ry="130" fill="url(#reiatsu-core)" class="reiatsu-pulse" style="animation-delay: -2.7s;"/>

  <!-- Subtle Japanese Watermark in Background -->
  <g opacity="0.06" fill="#ff1e38" transform="translate(680, 40)">
    <text x="0" y="110" font-size="120" font-family="'Yu Gothic', sans-serif" font-weight="900">卍</text>
    <text x="0" y="230" font-size="120" font-family="'Yu Gothic', sans-serif" font-weight="900">解</text>
  </g>

  <!-- Diagonal Energy Blade Accent -->
  <g filter="url(#crimson-glow)">
    <path d="M 960 20 L 740 320" stroke="#e50914" stroke-width="3" stroke-opacity="0.6"/>
    <path d="M 960 20 L 740 320" stroke="#ffffff" stroke-width="1" stroke-opacity="0.8"/>
  </g>

  <!-- Animated Getsuga Tensho Slash Beam -->
  <g class="slash-effect" filter="url(#blade-glow)">
    <polygon points="100,-40 220,-40 120,380 0,380" fill="url(#slash-grad)"/>
    <line x1="160" y1="-40" x2="60" y2="380" stroke="#ffffff" stroke-width="2.5"/>
  </g>

  <!-- Left Emblem: Pirate Jolly Roger x Hollow Silhouette -->
  <g class="pirate-glow" transform="translate(45, 75)">
    <!-- Crossed Blades Behind Skull -->
    <path d="M 15 20 L 145 170" stroke="#16181f" stroke-width="9" stroke-linecap="round"/>
    <path d="M 15 20 L 145 170" stroke="#ff1e38" stroke-width="2" stroke-opacity="0.8"/>
    <circle cx="15" cy="20" r="6" fill="#2d313d" stroke="#ff1e38" stroke-width="1.8"/>
    <circle cx="145" cy="170" r="6" fill="#2d313d" stroke="#ff1e38" stroke-width="1.8"/>

    <path d="M 145 20 L 15 170" stroke="#16181f" stroke-width="9" stroke-linecap="round"/>
    <path d="M 145 20 L 15 170" stroke="#ff1e38" stroke-width="2" stroke-opacity="0.8"/>
    <circle cx="145" cy="20" r="6" fill="#2d313d" stroke="#ff1e38" stroke-width="1.8"/>
    <circle cx="15" cy="170" r="6" fill="#2d313d" stroke="#ff1e38" stroke-width="1.8"/>

    <!-- Hat Brim -->
    <path d="M 25 72 Q 80 48 135 72 Q 80 62 25 72 Z" fill="#b3001e" stroke="#ff2244" stroke-width="1.5"/>
    <path d="M 45 68 Q 80 20 115 68 Z" fill="#1b1c24" stroke="#ff2244" stroke-width="1.5"/>
    <path d="M 43 64 Q 80 44 117 64" stroke="#e50914" stroke-width="3.5" fill="none"/>

    <!-- Skull -->
    <ellipse cx="80" cy="98" rx="36" ry="34" fill="#0d0e14" stroke="#ffffff" stroke-width="2.2"/>
    <path d="M 52 82 Q 62 92 56 112" stroke="#ff0033" stroke-width="3" fill="none"/>
    <path d="M 60 76 Q 72 90 68 116" stroke="#ff0033" stroke-width="2.5" fill="none"/>

    <!-- Eye Sockets -->
    <ellipse cx="68" cy="98" rx="9" ry="11" fill="#050508" stroke="#ff1a40" stroke-width="1.5"/>
    <ellipse cx="92" cy="98" rx="9" ry="11" fill="#050508" stroke="#ff1a40" stroke-width="1.5"/>
    <circle cx="68" cy="98" r="4" fill="url(#eye-glow)" filter="url(#crimson-glow)">
      <animate attributeName="r" values="3.5; 5; 3.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="92" cy="98" r="4" fill="url(#eye-glow)" filter="url(#crimson-glow)">
      <animate attributeName="r" values="3.5; 5; 3.5" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Teeth -->
    <path d="M 62 122 L 98 122 L 94 138 L 66 138 Z" fill="#0d0e14" stroke="#ffffff" stroke-width="1.8"/>
    <line x1="70" y1="122" x2="70" y2="138" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="77" y1="122" x2="77" y2="138" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="83" y1="122" x2="83" y2="138" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="90" y1="122" x2="90" y2="138" stroke="#ffffff" stroke-width="1.5"/>

    <rect x="25" y="152" width="110" height="18" rx="9" fill="#180407" stroke="#e50914" stroke-width="1"/>
    <text x="80" y="165" font-family="'Poppins', sans-serif" font-size="9" font-weight="600" fill="#ff4d6a" text-anchor="middle" letter-spacing="1.5">BOUNTY ACTIVE</text>
  </g>

  <!-- Center Typography -->
  <g transform="translate(235, 55)">
    <!-- Top Status Bar -->
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="105" height="22" rx="4" fill="#1e0509" stroke="#ff2244" stroke-width="1"/>
      <circle cx="10" cy="11" r="3.5" fill="#ff0033"/>
      <text x="20" y="15" class="text-badge" font-size="9.5" fill="#ff6b81">BANKAI MODE</text>

      <rect x="115" y="0" width="140" height="22" rx="4" fill="#0d1017" stroke="#30363d" stroke-width="1"/>
      <text x="125" y="15" class="text-badge" font-size="9.5" fill="#8b949e">LOCATION: PAKISTAN</text>

      <rect x="265" y="0" width="135" height="22" rx="4" fill="#0d1017" stroke="#30363d" stroke-width="1"/>
      <text x="275" y="15" class="text-badge" font-size="9.5" fill="#ff4466">GRAND LINE ROUTE</text>
    </g>

    <!-- Name: BILAL BUTT. with dot -->
    <text x="0" y="95" font-size="52" fill="url(#text-grad)" class="text-title">BILAL BUTT<tspan fill="#e50914">.</tspan></text>

    <!-- Accent Line -->
    <g transform="translate(0, 110)">
      <line x1="0" y1="0" x2="480" y2="0" stroke="#ff0033" stroke-width="2" filter="url(#crimson-glow)"/>
      <line x1="0" y1="0" x2="320" y2="0" stroke="#ffffff" stroke-width="1.2"/>
      <polygon points="480,-2.5 495,0 480,2.5" fill="#ff1e38"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>
    </g>

    <!-- Tagline: BUILDING INTELLIGENCE. CONQUERING CODE. -->
    <text x="2" y="142" font-size="14" fill="#f0f6fc" class="text-tagline">
      BUILDING INTELLIGENCE. CONQUERING CODE.
    </text>

    <!-- Role description -->
    <text x="2" y="172" font-size="13" fill="#8b949e" class="text-sub">
      AI and ML Engineer / Computer Vision / Software Development
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 200)">
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#140609" stroke="#e50914" stroke-width="1"/>
      <text x="14" y="18" class="text-badge" font-size="10.5" fill="#ff4d66">ZANGETSU MODE</text>

      <rect x="140" y="0" width="135" height="28" rx="6" fill="#0b0e14" stroke="#ff2244" stroke-width="1"/>
      <text x="154" y="18" class="text-badge" font-size="10.5" fill="#e6edf3">NEURAL SYSTEMS</text>

      <rect x="285" y="0" width="135" height="28" rx="6" fill="#0b0e14" stroke="#30363d" stroke-width="1"/>
      <text x="299" y="18" class="text-badge" font-size="10.5" fill="#8b949e">CONQUERING CODE</text>
    </g>
  </g>

  <!-- Frame Accents -->
  <path d="M 12 35 L 12 12 L 35 12" fill="none" stroke="#e50914" stroke-width="2.5" filter="url(#crimson-glow)"/>
  <circle cx="12" cy="12" r="2" fill="#ffffff"/>
  <path d="M 915 12 L 938 12 L 938 35" fill="none" stroke="#e50914" stroke-width="2.5" filter="url(#crimson-glow)"/>
  <circle cx="938" cy="12" r="2" fill="#ffffff"/>
  <path d="M 12 305 L 12 328 L 35 328" fill="none" stroke="#e50914" stroke-width="2.5" filter="url(#crimson-glow)"/>
  <circle cx="12" cy="328" r="2" fill="#ffffff"/>
  <path d="M 915 328 L 938 328 L 938 305" fill="none" stroke="#e50914" stroke-width="2.5" filter="url(#crimson-glow)"/>
  <circle cx="938" cy="328" r="2" fill="#ffffff"/>
  <rect x="6" y="6" width="938" height="328" rx="12" fill="none" stroke="#e50914" stroke-width="0.8" stroke-opacity="0.3"/>
</svg>