<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040507"/>
      <stop offset="35%" stop-color="#090b10"/>
      <stop offset="70%" stop-color="#0d080c"/>
      <stop offset="100%" stop-color="#050306"/>
    </linearGradient>

    <radialGradient id="reiatsu-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0033" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#990018" stop-opacity="0.2"/>
      <stop offset="75%" stop-color="#4a000c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="eye-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ff1a40"/>
      <stop offset="70%" stop-color="#b3001e"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="slash-grad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff1e38" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ff1e38" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#ff1e38" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff1e38" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="blade-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e38"/>
      <stop offset="45%" stop-color="#14161d"/>
      <stop offset="50%" stop-color="#08090d"/>
      <stop offset="55%" stop-color="#181b24"/>
      <stop offset="100%" stop-color="#2c303c"/>
    </linearGradient>

    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fff3b0"/>
      <stop offset="100%" stop-color="#aa820a"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f5e6e8"/>
      <stop offset="85%" stop-color="#ff99a8"/>
      <stop offset="100%" stop-color="#ff2244"/>
    </linearGradient>

    <!-- Filters for Bankai / Reiatsu Glow -->
    <filter id="crimson-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="blade-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#221118" stroke-width="0.7" stroke-opacity="0.4"/>
      <circle cx="0" cy="0" r="1" fill="#e50914" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulse-reiatsu {
      0%, 100% { opacity: 0.45; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.08); }
    }
    @keyframes slash-sweep {
      0% { transform: translateX(-950px) skewX(-25deg); opacity: 0; }
      15% { opacity: 0.95; }
      40% { transform: translateX(950px) skewX(-25deg); opacity: 0; }
      100% { transform: translateX(950px) skewX(-25deg); opacity: 0; }
    }
    @keyframes ember-float-1 {
      0% { transform: translateY(0px) translateX(0px); opacity: 0; }
      50% { opacity: 0.9; }
      100% { transform: translateY(-160px) translateX(40px); opacity: 0; }
    }
    @keyframes ember-float-2 {
      0% { transform: translateY(0px) translateX(0px); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-190px) translateX(-35px); opacity: 0; }
    }
    @keyframes radar-scan {
      0% { transform: translateY(0px); opacity: 0.15; }
      50% { opacity: 0.5; }
      100% { transform: translateY(340px); opacity: 0.05; }
    }
    @keyframes eye-flame {
      0%, 100% { r: 3.5; opacity: 0.9; }
      50% { r: 5.5; opacity: 1; }
    }
    @keyframes text-shimmer {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(229, 9, 20, 0.6)); }
      50% { filter: drop-shadow(0 0 25px rgba(255, 30, 60, 0.95)) drop-shadow(0 0 40px rgba(180, 0, 25, 0.5)); }
    }
    @keyframes flag-drift {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(1.5deg) translateY(-2px); }
    }

    .reiatsu-pulse {
      transform-origin: 475px 170px;
      animation: pulse-reiatsu 4s ease-in-out infinite;
    }
    .slash-effect {
      animation: slash-sweep 4.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      letter-spacing: 7px;
      animation: text-shimmer 3s ease-in-out infinite;
    }
    .text-tagline {
      font-family: "Courier New", Courier, monospace, "Segoe UI", sans-serif;
      font-weight: 700;
      letter-spacing: 5px;
    }
    .ember1 { animation: ember-float-1 3.5s ease-in infinite; }
    .ember2 { animation: ember-float-2 4.2s ease-in infinite 1.2s; }
    .ember3 { animation: ember-float-1 3.8s ease-in infinite 2.1s; }
    .radar-line { animation: radar-scan 6s linear infinite; }
    .pirate-glow { animation: flag-drift 5s ease-in-out infinite; transform-origin: 110px 170px; }
  </style>

  <!-- Card Background -->
  <rect width="950" height="340" rx="16" fill="url(#bg-grad)"/>

  <!-- Tech Grid Underlay -->
  <rect width="950" height="340" rx="16" fill="url(#grid)"/>

  <!-- Bankai Spiritual Pressure / Reiatsu Cloud -->
  <ellipse cx="475" cy="170" rx="420" ry="160" fill="url(#reiatsu-core)" class="reiatsu-pulse"/>
  <ellipse cx="200" cy="170" rx="260" ry="130" fill="url(#reiatsu-core)" class="reiatsu-pulse" style="animation-delay: -1.8s;"/>
  <ellipse cx="780" cy="170" rx="240" ry="130" fill="url(#reiatsu-core)" class="reiatsu-pulse" style="animation-delay: -2.7s;"/>

  <!-- Subtle Cyber Radar Scan Beam -->
  <line x1="0" y1="0" x2="950" y2="0" stroke="#ff1a40" stroke-width="1.5" stroke-opacity="0.4" class="radar-line"/>

  <!-- Japanese Calligraphy / Kanji: 卍解 (BANKAI) Watermark Background -->
  <g opacity="0.08" fill="#ff1e38" transform="translate(680, 40)">
    <text x="0" y="110" font-size="120" font-family="'Yu Gothic', 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-weight="900">卍</text>
    <text x="0" y="230" font-size="120" font-family="'Yu Gothic', 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-weight="900">解</text>
  </g>

  <!-- Japanese Kanji Watermark Left: 覇気 (HAKI / CONQUEROR'S SPIRIT) -->
  <g opacity="0.06" fill="#ff2244" transform="translate(60, 50)">
    <text x="0" y="90" font-size="95" font-family="'Yu Gothic', 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-weight="900">海</text>
    <text x="0" y="190" font-size="95" font-family="'Yu Gothic', 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-weight="900">賊</text>
  </g>

  <!-- BANKAI / ZANGETSU CUTTING BLADE & SLASH (Center-Right Background Accent) -->
  <g filter="url(#crimson-glow)">
    <!-- Tensa Zangetsu Chain Silhouette Edge -->
    <path d="M 870 15 L 890 35 L 880 55 L 900 75 L 890 95 L 910 115 L 900 135 L 920 155 L 910 175" fill="none" stroke="#ff1a40" stroke-width="2.5" stroke-opacity="0.4"/>
    <!-- Diagonal Energy Blade Arc -->
    <path d="M 960 20 L 740 320" stroke="#e50914" stroke-width="3.5" stroke-opacity="0.6"/>
    <path d="M 960 20 L 740 320" stroke="#ffffff" stroke-width="1" stroke-opacity="0.9"/>
  </g>

  <!-- ANIMATED GETSUGA TENSHO SLASH BEAM -->
  <g class="slash-effect" filter="url(#blade-glow)">
    <polygon points="100,-40 220,-40 120,380 0,380" fill="url(#slash-grad)"/>
    <line x1="160" y1="-40" x2="60" y2="380" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- LEFT EMBLEM: PIRATE JOLLY ROGER × HOLLOW MASK HYBRID -->
  <g class="pirate-glow" transform="translate(45, 75)">
    <!-- Crossed Bones / Katanas Behind Skull -->
    <!-- Blade 1: Top-Left to Bottom-Right -->
    <path d="M 15 20 L 145 170" stroke="#16181f" stroke-width="10" stroke-linecap="round"/>
    <path d="M 15 20 L 145 170" stroke="#ff1e38" stroke-width="2" stroke-opacity="0.8"/>
    <circle cx="15" cy="20" r="7" fill="#2d313d" stroke="#ff1e38" stroke-width="2"/>
    <circle cx="145" cy="170" r="7" fill="#2d313d" stroke="#ff1e38" stroke-width="2"/>

    <!-- Blade 2: Top-Right to Bottom-Left -->
    <path d="M 145 20 L 15 170" stroke="#16181f" stroke-width="10" stroke-linecap="round"/>
    <path d="M 145 20 L 15 170" stroke="#ff1e38" stroke-width="2" stroke-opacity="0.8"/>
    <circle cx="145" cy="20" r="7" fill="#2d313d" stroke="#ff1e38" stroke-width="2"/>
    <circle cx="15" cy="170" r="7" fill="#2d313d" stroke="#ff1e38" stroke-width="2"/>

    <!-- Pirate Straw Hat Brim / Hollow Crest -->
    <path d="M 25 72 Q 80 48 135 72 Q 80 62 25 72 Z" fill="#b3001e" stroke="#ff2244" stroke-width="1.5"/>
    <!-- Straw Hat Crown with Blood-Red Ribbon -->
    <path d="M 45 68 Q 80 20 115 68 Z" fill="#1b1c24" stroke="#ff2244" stroke-width="1.5"/>
    <path d="M 43 64 Q 80 44 117 64" stroke="#e50914" stroke-width="4" fill="none"/>

    <!-- The Jolly Roger Skull -->
    <ellipse cx="80" cy="98" rx="36" ry="34" fill="#0d0e14" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Hollow Mask Black & Crimson Stripes on Left Half -->
    <path d="M 52 82 Q 62 92 56 112" stroke="#ff0033" stroke-width="3.5" fill="none"/>
    <path d="M 60 76 Q 72 90 68 116" stroke="#ff0033" stroke-width="3" fill="none"/>
    <path d="M 68 72 Q 78 88 77 118" stroke="#ff0033" stroke-width="2.5" fill="none"/>

    <!-- Skull Eye Sockets (Glowing Red Hollow / Conqueror Haki Eyes) -->
    <ellipse cx="68" cy="98" rx="9" ry="11" fill="#050508" stroke="#ff1a40" stroke-width="1.5"/>
    <ellipse cx="92" cy="98" rx="9" ry="11" fill="#050508" stroke="#ff1a40" stroke-width="1.5"/>
    
    <!-- Glowing Eye Pupils with animated pulse -->
    <circle cx="68" cy="98" r="4" fill="url(#eye-glow)" class="eye-pupil" filter="url(#crimson-glow)">
      <animate attributeName="r" values="3.5; 5.5; 3.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="92" cy="98" r="4" fill="url(#eye-glow)" class="eye-pupil" filter="url(#crimson-glow)">
      <animate attributeName="r" values="3.5; 5.5; 3.5" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Skull Nose Cavity -->
    <polygon points="80,108 77,116 83,116" fill="#ffffff" opacity="0.8"/>

    <!-- Skull Jaw & Teeth (Pirate Grin) -->
    <path d="M 62 122 L 98 122 L 94 138 L 66 138 Z" fill="#0d0e14" stroke="#ffffff" stroke-width="2"/>
    <line x1="70" y1="122" x2="70" y2="138" stroke="#ffffff" stroke-width="1.8"/>
    <line x1="77" y1="122" x2="77" y2="138" stroke="#ffffff" stroke-width="1.8"/>
    <line x1="83" y1="122" x2="83" y2="138" stroke="#ffffff" stroke-width="1.8"/>
    <line x1="90" y1="122" x2="90" y2="138" stroke="#ffffff" stroke-width="1.8"/>

    <!-- Wanted Bounty / Rank Seal Below Jolly Roger -->
    <rect x="25" y="152" width="110" height="18" rx="9" fill="#180407" stroke="#e50914" stroke-width="1"/>
    <text x="80" y="165" font-family="'Courier New', monospace" font-size="9" font-weight="900" fill="#ff4d6a" text-anchor="middle" letter-spacing="2">★ BOUNTY: ACTIVE ★</text>
  </g>

  <!-- FLOATING RED REIATSU EMBERS / SPIRIT PARTICLES -->
  <g fill="#ff1e38" filter="url(#crimson-glow)">
    <circle cx="280" cy="260" r="2.5" class="ember1"/>
    <circle cx="340" cy="290" r="1.8" class="ember2"/>
    <circle cx="480" cy="270" r="3.2" class="ember3"/>
    <circle cx="620" cy="280" r="2.2" class="ember1"/>
    <circle cx="750" cy="250" r="2.8" class="ember2"/>
    <circle cx="830" cy="290" r="1.5" class="ember3"/>
    <circle cx="560" cy="300" r="2.0" class="ember1"/>
  </g>

  <!-- CENTER-RIGHT MAIN HERO TYPOGRAPHY & IDENTITY -->
  <g transform="translate(235, 55)">
    <!-- Top HUD / Protocol Bar -->
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="130" height="22" rx="4" fill="#1e0509" stroke="#ff2244" stroke-width="1.2"/>
      <circle cx="12" cy="11" r="4" fill="#ff0033">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="15" font-family="'Courier New', monospace" font-size="10" font-weight="800" fill="#ff6b81" letter-spacing="2">BANKAI // 卍解</text>

      <rect x="140" y="0" width="175" height="22" rx="4" fill="#0d1017" stroke="#30363d" stroke-width="1"/>
      <text x="150" y="15" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#8b949e" letter-spacing="1.5">SYS.ORIGIN: PAKISTAN</text>

      <rect x="325" y="0" width="145" height="22" rx="4" fill="#0d1017" stroke="#30363d" stroke-width="1"/>
      <text x="335" y="15" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#ff4466" letter-spacing="1.5">GRAND LINE ROUTE</text>
    </g>

    <!-- Main Title: THEBILALBUTT -->
    <text x="0" y="95" font-size="52" fill="url(#text-grad)" class="text-title">THEBILALBUTT</text>

    <!-- Glowing Red Accent Line Under Title with Katana Blade Shape -->
    <g transform="translate(0, 110)">
      <line x1="0" y1="0" x2="480" y2="0" stroke="#ff0033" stroke-width="2.5" filter="url(#crimson-glow)"/>
      <line x1="0" y1="0" x2="320" y2="0" stroke="#ffffff" stroke-width="1.5"/>
      <polygon points="480,-3 495,0 480,3" fill="#ff1e38"/>
      <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
    </g>

    <!-- Tagline: BUILDING INTELLIGENCE. CONQUERING CODE. -->
    <text x="2" y="142" font-size="14.5" fill="#f0f6fc" class="text-tagline">
      BUILDING INTELLIGENCE. CONQUERING CODE.
    </text>

    <!-- Mission / Role Description Subtitle -->
    <text x="2" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#a5b4c6" letter-spacing="1.2">
      AI/ML Engineer  ✦  Computer Vision  ✦  Software Architect  ✦  Pirate Coder
    </text>

    <!-- Interactive / Status Badges Row -->
    <g transform="translate(0, 200)">
      <!-- Badge 1: Hollow Mask AI -->
      <rect x="0" y="0" width="155" height="28" rx="6" fill="#140609" stroke="#e50914" stroke-width="1.2"/>
      <text x="14" y="18" font-family="'Courier New', monospace" font-size="11" font-weight="800" fill="#ff4d66" letter-spacing="1">⚔️ ZANGETSU MODE</text>

      <!-- Badge 2: Neural Conqueror -->
      <rect x="165" y="0" width="165" height="28" rx="6" fill="#0b0e14" stroke="#ff2244" stroke-width="1"/>
      <text x="177" y="18" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#e6edf3" letter-spacing="1">🧠 NEURAL HAKI: ON</text>

      <!-- Badge 3: Grand Line Dev -->
      <rect x="340" y="0" width="170" height="28" rx="6" fill="#0b0e14" stroke="#30363d" stroke-width="1"/>
      <text x="352" y="18" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#8b949e" letter-spacing="1">🏴☠️ CONQUERING CODE</text>
    </g>
  </g>

  <!-- CYBER CORNER BRACKETS & FRAME ACCENTS -->
  <!-- Top Left -->
  <path d="M 12 35 L 12 12 L 35 12" fill="none" stroke="#e50914" stroke-width="3" filter="url(#crimson-glow)"/>
  <circle cx="12" cy="12" r="2.5" fill="#ffffff"/>

  <!-- Top Right -->
  <path d="M 915 12 L 938 12 L 938 35" fill="none" stroke="#e50914" stroke-width="3" filter="url(#crimson-glow)"/>
  <circle cx="938" cy="12" r="2.5" fill="#ffffff"/>

  <!-- Bottom Left -->
  <path d="M 12 305 L 12 328 L 35 328" fill="none" stroke="#e50914" stroke-width="3" filter="url(#crimson-glow)"/>
  <circle cx="12" cy="328" r="2.5" fill="#ffffff"/>

  <!-- Bottom Right -->
  <path d="M 915 328 L 938 328 L 938 305" fill="none" stroke="#e50914" stroke-width="3" filter="url(#crimson-glow)"/>
  <circle cx="938" cy="328" r="2.5" fill="#ffffff"/>

  <!-- Border Frame Accent Line -->
  <rect x="6" y="6" width="938" height="328" rx="12" fill="none" stroke="#e50914" stroke-width="1" stroke-opacity="0.3"/>
</svg>