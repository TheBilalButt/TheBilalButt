<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 48" width="100%" height="48">
  <defs>
    <linearGradient id="div-slash" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1a40" stop-opacity="0"/>
      <stop offset="30%" stop-color="#8b0000" stop-opacity="0.4"/>
      <stop offset="45%" stop-color="#e50914" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e50914" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#8b0000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff1a40" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="div-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ff1e38"/>
      <stop offset="60%" stop-color="#800000" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="div-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse-slash {
      0%, 100% { opacity: 0.6; stroke-width: 1.5; }
      50% { opacity: 1; stroke-width: 2.5; }
    }
    @keyframes pulse-diamond {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #e50914); }
      50% { transform: scale(1.15); filter: drop-shadow(0 0 12px #ff1a40); }
    }
    .div-line {
      animation: pulse-slash 3s ease-in-out infinite;
    }
    .div-center {
      transform-origin: 475px 24px;
      animation: pulse-diamond 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Left Katana Edge Slash -->
  <line x1="30" y1="24" x2="430" y2="24" stroke="url(#div-slash)" stroke-width="2" class="div-line"/>
  <circle cx="120" cy="24" r="1.5" fill="#e50914" opacity="0.6"/>
  <circle cx="280" cy="24" r="2" fill="#ff1a40" opacity="0.8"/>

  <!-- Right Katana Edge Slash -->
  <line x1="520" y1="24" x2="920" y2="24" stroke="url(#div-slash)" stroke-width="2" class="div-line"/>
  <circle cx="670" cy="24" r="2" fill="#ff1a40" opacity="0.8"/>
  <circle cx="830" cy="24" r="1.5" fill="#e50914" opacity="0.6"/>

  <!-- Center Crest (Bankai Tsuba Cross & Pirate Skull Diamond) -->
  <g class="div-center">
    <!-- Glowing Aura Core -->
    <circle cx="475" cy="24" r="20" fill="url(#div-core)"/>
    
    <!-- Crossed Bankai Blades Silhouette -->
    <path d="M 458 10 L 492 38" stroke="#10121a" stroke-width="3" stroke-linecap="round"/>
    <path d="M 458 10 L 492 38" stroke="#e50914" stroke-width="1.2"/>
    <path d="M 492 10 L 458 38" stroke="#10121a" stroke-width="3" stroke-linecap="round"/>
    <path d="M 492 10 L 458 38" stroke="#e50914" stroke-width="1.2"/>

    <!-- Central Diamond / Hollow Crest -->
    <polygon points="475,13 486,24 475,35 464,24" fill="#0b0c10" stroke="#ff2244" stroke-width="1.8"/>
    <!-- Inner Core Dot -->
    <circle cx="475" cy="24" r="3" fill="#ffffff" filter="url(#div-glow)"/>
  </g>
</svg>